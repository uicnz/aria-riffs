# Dir Differ Riff Configuration

# Riff metadata for TUI discovery
aria-riff:
    name: dir-differ
    description: Directory and file comparison
    category: utilities

dir-differ:
    paths:
        input:
            source: null
            target: null
    processing:
        showContent: false
        summaryOnly: false

logging:
    level: "info"
    verbose: false
    file: "~/.aria/logs/dir-differ.log"
    maxFileSizeMb: 10
    maxFiles: 7

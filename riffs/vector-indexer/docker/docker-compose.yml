name: aria-qdrant

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: aria-qdrant
    ports:
      - "6333:6333"  # REST API
      - "6334:6334"  # gRPC API (optional)
    volumes:
      # Map Qdrant storage to Aria's standard .aria/db/ directory
      # Maintains data locality with other Aria databases
      - ../../../.aria/db/vector-indexer:/qdrant/storage
    environment:
      # Qdrant configuration
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    # Healthcheck removed - ServiceManager checks /readyz endpoint directly

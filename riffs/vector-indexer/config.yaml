# vector-indexer Configuration

# Riff metadata for TUI discovery
aria-riff:
    name: vector-indexer
    description: Semantic vector indexing with embeddings and Qdrant
    category: documents

vector-indexer:
    # Ollama connection (for embeddings and optional reranking)
    ollama:
        host: 'http://localhost:11434'
        timeout: 120000

    # llama.cpp server connections (one instance per model)
    # Each llama-server loads ONE model at startup (unlike Ollama which manages multiple models)

    # Embedding server (optional - can use ollama provider instead)
    # Find your model path: ollama show qwen3-embedding:8b --modelfile | grep '^FROM '
    # TODO Phase 2: Copy models to ~/.aria/models/ with clean names
    llamaCppEmbeddings:
        host: 'http://localhost:8080'
        timeout: 120000
        modelPath: '~/.ollama/models/blobs/sha256-3fcd3febec8b3fd64435204db75bf0dd73b91\ e8d0661e0331acfe7e7c3120b85'

    # Reranking server (recommended - provides logprobs access)
    # Find your model path: ollama show dengcao/Qwen3-Reranker-4B:Q5_K_M --modelfile | grep '^FROM '
    # TODO Phase 2: Copy models to ~/.aria/models/ with clean names
    llamaCppReranker:
        host: 'http://localhost:8081'
        timeout: 30000
        modelPath: '~/.ollama/models/blobs/sha256-e8a4eb47ff2d56b3adcfa631b28c2f575d217\ 78e260d5a2889464a6cc0897954'

    # Qdrant connection
    qdrant:
        host: 'localhost'
        port: 6333
        apiKey: null
        timeout: 30000

    # Paths
    paths:
        input:
            documents: '~/.aria/assets/vector-indexer/documents'
            compose: '~/.aria/riffs/vector-indexer/docker/docker-compose.yml'
        output:
            dir: '~/.aria/exports/vector-indexer'
            qdrant: '~/.aria/db/vector-indexer'  # Matches docker-compose.yml volume mapping
            pids: '~/.aria/db/vector-indexer/pids'  # PID file storage (user-level Aria artifacts)
        database:
            file: '~/.aria/db/vector-indexer/metadata.sqlite'

    # Embedding settings
    embedding:
        # Available providers: ollama, llama-cpp
        # - ollama: Convenient, manages multiple models (default)
        # - llama-cpp: Dedicated server, more control (requires llama_cpp_embeddings server running)
        provider: 'llama-cpp'  # Testing full pipeline with llama.cpp
        # Primary model (8B for maximum accuracy)
        model: 'qwen3-embedding:8b'
        # Fallback model (4B for memory-constrained systems)
        fallbackModel: 'qwen3-embedding:4b'
        # NOTE: Ollama returns model's native quantized dimensions (no Matryoshka control)
        # qwen3-embedding:4b actual output: 2560 dimensions
        # qwen3-embedding:8b actual output: 4096 dimensions
        dimensions: 4096  # For 8b model (change to 2560 if using 4b)
        # Default instruction (can be overridden per collection)
        instruction: 'Represent this document for semantic search'
        batchSize: 10
        # Memory threshold for auto-selecting 4B vs 8B model
        memoryThresholdGb: 16

        # Chunking strategy (domain.method naming convention)
        chunking:
            strategy: 'generic.hierarchical'

            generic.hierarchical:
                primaryLevel: 1  # Start chunking at # headings (H1)
                maxLevels: [1, 2, 3, 4, 5, 6]  # Accept all heading levels
                maxTokens: 512  # Maximum tokens per chunk
                minTokens: 50  # Minimum tokens per chunk
                # Small document threshold: if entire document <= this many tokens,
                # index as single vector instead of fragmenting by headers
                wholeDocumentThreshold: 512
                fallback: 'paragraph'  # Fall back to paragraph splitting if needed
                preserve: ['```', '~~~']  # Code blocks to preserve
                includeContext: true  # Include parent headings as context

            # Aria RFP-specific strategy with callout metadata extraction
            # Extracts metadata from > [!TIP] callout blocks and enriches chunks
            aria.heading-enriched:
                # Pattern to identify callout blocks (> [!TIP] Request Details)
                calloutPattern: '^>\s*\[!TIP\]'

                # Fields to extract from callout content
                fields:
                    identifier:
                        regex: '>\s*\*\*Identifier:\*\*\s*(.+)'
                        name: 'identifier'
                        captureGroup: 1
                        required: true
                    description:
                        regex: '>\s*\*\*Description:\*\*\s*(.+)'
                        name: 'description'
                        captureGroup: 1
                        required: false
                    priority:
                        regex: '>\s*\*\*Priority:\*\*\s*(.+)'
                        name: 'priority'
                        captureGroup: 1
                        required: false
                    category:
                        regex: '>\s*\*\*Category:\*\*\s*(.+)'
                        name: 'category'
                        captureGroup: 1
                        required: false
                    department:
                        regex: '>\s*\*\*Department:\*\*\s*(.+)'
                        name: 'department'
                        captureGroup: 1
                        required: false
                    leader:
                        regex: '>\s*\*\*Leader:\*\*\s*(.+)'
                        name: 'leader'
                        captureGroup: 1
                        required: false
                    customise:
                        regex: '>\s*\*\*Customise:\*\*\s*(.+)'
                        name: 'customise'
                        captureGroup: 1
                        required: false

                # Template for enriching chunk content with extracted metadata
                # Variables: {title}, {heading}, {identifier}, {description}, {priority}, {category}, {department}, {leader}, {customise}
                enrichmentTemplate: '[{title} | {identifier} | {department}]\n\n'

                # Chunking parameters
                maxTokens: 512
                minTokens: 50
                wholeDocumentThreshold: 512
                includeContext: true

            metadataExtraction:
                enabled: true
                patterns: []

    # Sparse vector settings (BM25)
    sparse:
        enabled: true
        k1: 1.5
        b: 0.75

    # Re-ranker settings
    reranker:
        # Available providers: ollama, llama-cpp
        # - ollama: Prompt-based scoring (limited accuracy, no logprobs)
        # - llama-cpp: Proper Qwen3-Reranker with logprobs (recommended)
        provider: 'llama-cpp'  # Using llama-server for proper logprobs access

        # Ollama models (verified dengcao uploads)
        # Q5_K_M: Recommended (97% accuracy, smaller size)
        # Q8_0: Maximum accuracy (99% accuracy, 50% larger files)
        # Q4_K_M: Memory-constrained (95% accuracy, smallest size)

        # 4B model options:
        # - dengcao/Qwen3-Reranker-4B:Q5_K_M (2.9GB, recommended)
        # - dengcao/Qwen3-Reranker-4B:Q8_0 (4.3GB, max accuracy)
        # - dengcao/Qwen3-Reranker-4B:Q4_K_M (2.5GB, low memory)
        model: 'dengcao/Qwen3-Reranker-4B:Q5_K_M'

        # 8B model options (for high-memory systems):
        # - dengcao/Qwen3-Reranker-8B:Q5_K_M (5.8GB, recommended)
        # - dengcao/Qwen3-Reranker-8B:Q8_0 (8.7GB, max accuracy)
        # - dengcao/Qwen3-Reranker-8B:Q4_K_M (5.0GB, low memory)
        highMemoryModel: 'dengcao/Qwen3-Reranker-8B:Q5_K_M'

        enabled: true
        topK: 100  # Initial retrieval from Qdrant
        finalK: 20  # After re-ranking
        # Memory-based model selection
        autoSelectModel: true  # Choose 4B/8B based on available memory
        memoryThresholdGb: 32  # Use 8B model if >= 32GB RAM

    # Hybrid search weights
    search:
        denseWeight: 0.7
        sparseWeight: 0.3

    # Service orchestration
    services:
        autoStart: true  # Auto-start required services
        shutdownOnExit: false  # Keep services running after riff exits (default)
        startupTimeoutSeconds: 120  # Max wait for service startup (Qdrant needs ~90s)
        healthCheckIntervalMs: 1000  # Health check polling interval

        # Docker configuration (for Qdrant container)
        docker:
            containerName: 'aria-qdrant'  # Docker container name for Qdrant

        # llama-server configuration (applies to both embedding and reranker servers)
        llamaServer:
            hostBinding: '0.0.0.0'  # Host binding (0.0.0.0 = all interfaces, 127.0.0.1 = localhost only)
            gpuLayers: 99  # Number of layers to offload to GPU (-1 = all, 0 = CPU only, 99 = auto)
            disableLogging: true  # Disable llama-server internal logging (--log-disable flag)

    # Database settings
    database:
        journalMode: 'WAL'
        backupCount: 3

    # Processing settings
    processing:
        batchSize: 10
        progressBar: true
        parallelWorkers: 4

logging:
    level: 'info'
    verbose: false
    file: '~/.aria/logs/vector-indexer.log'
    maxFileSizeMb: 50
    maxFiles: 30

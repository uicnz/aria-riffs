# doc-indexer Configuration

# Riff metadata for TUI discovery
aria-riff:
    name: doc-indexer
    description: Document indexing, semantic search, and knowledge graphs
    category: documents

doc-indexer:
    # Category definitions (domain-specific classification)
    categories:
        - name: 'standard'
          description: 'Cookie-cutter: use verbatim across clients, no customisation needed'
          customise: false
        - name: 'hybrid'
          description: 'Mix: standard framework with specific details added'
          customise: true
        - name: 'specific'
          description: 'Snowflake: 100% custom, unique to each client, never done before'
          customise: true

    # Priority levels (domain-specific compliance levels)
    priorities:
        - name: 'Must Fully Comply'
          level: 'must'
        - name: 'Should Comply'
          level: 'should'
        - name: 'Nice to Comply'
          level: 'nice'

    # Department definitions (domain-specific organizational structure)
    departments:
        - name: 'core-services'
          description: 'Responsible for fundamental network services including routing, switching, and core infrastructure'
          leader: ''
        - name: 'operations-engineering-noc'
          description: 'Handles network operations, monitoring, incident response, and engineering support'
          leader: ''
        - name: 'commercial-service-management'
          description: 'Manages commercial aspects, service delivery, and customer relationship management'
          leader: ''
        - name: 'project-delivery'
          description: 'Oversees project implementation, timelines, and delivery of network solutions'
          leader: ''
        - name: 'business-operations'
          description: 'Handles business processes, operational procedures, and organizational management'
          leader: ''
        - name: 'security-compliance'
          description: 'Ensures security standards, compliance requirements, and risk management'
          leader: ''

    # Path settings
    paths:
        input:
            # Default directory to index
            documents: '~/.aria/exports/cello/clients/inland-revenue-department/response/rfp-responses-decomposed'
            # Full RFP path for context
            fullRfp: '~/.aria/exports/cello/clients/inland-revenue-department/response/rfp-responses-original/rfp-wifi-and-internet-rfp-appendix-a-response-form.md'
        output:
            # Output directory for graph and documents
            dir: '~/.aria/db/doc-indexer'
        template:
            # Graph JSON output filename
            graph: 'graph.json'
            # Documents JSONL output filename
            documents: 'documents.jsonl'
            # HTML viewer output filename
            viewer: 'viewer.html'
        database:
            # SQLite database file
            file: '~/.aria/db/doc-indexer/doc-indexer.sqlite'

    # RFP parser configuration (optional - omit for non-RFP documents)
    rfp:
        # Static metadata (overrides extraction if both provided) note we need a method to handle any client. Right now, the scope of this is too myopic.
        metadata:
            vendor: 'Cello Group Limited'
            client: 'Inland Revenue'
            rfpName: 'WiFi & Internet'

        # Dynamic metadata extraction patterns (applied to first file)
        extraction:
            vendor:
                pattern: '\|\s*Business website:\s*\|\s*<([^>]+)>'
                fallback: 'Cello Group Limited'
            client:
                pattern: 'Client:\s*(.+)'
                fallback: null
            rfpName:
                pattern: 'RFP Name:\s*(.+)'
                fallback: null
            proposalDate:
                pattern: 'Date of this proposal:\s*([\d-]+)'
                dateFormat: 'DD-MM-YY'

        # Requirement identifier patterns (regex-based)
        requirements:
            patterns:
                - '\b(BR\d{1,4})\b'  # Business Requirements
                - '\b(MR\d{1,4})\b'  # Mandatory Requirements
                - '\b(SR\d{1,4})\b'  # Security Requirements
                - '\b(PR\d{1,4})\b'  # Performance Requirements

    # Search configuration
    search:
        # Scoring weights for hybrid search ranking
        # Base weights should sum to 1.0 for the primary formula
        weights:
            # Base scoring weights (sum to 1.0)
            title: 0.25  # Weight for title match score
            identifier: 0.15  # Weight for identifier match score
            semantic: 0.30  # Weight for semantic similarity
            lexical: 0.20  # Weight for lexical/RRF score
            phrase: 0.10  # Weight for exact phrase match
            # Bonus multipliers
            identifierBoost: 0.20  # Extra boost for exact identifier matches
            phraseBoost: 0.15  # Extra boost for phrase matches
            passBonus: 0.025  # Bonus per retrieval pass (capped at 0.1)

        # Snippet extraction settings
        # Number of lines of context around the match (1 = tight, 2 = moderate, 3+ = verbose)
        snippetContextLines: 1

    # OpenAI model for embeddings
    model: 'text-embedding-3-large'
    # Embedding dimensions
    dimensions: 3072
    # Maximum characters per item for embedding
    maxEmbedChars: 20000
    # Section mode: 'response', 'request', 'both', or 'full'
    sections: 'both'
    # Bias embeddings toward Response sections
    weightResponse: 1.8
    # Enable full-text search (FTS5)
    useFts: true
    # Enable hybrid lexical+semantic search
    hybrid: true
    # Lexical weight when hybrid is enabled (0.0-1.0)
    alpha: 0.2
    # Show metadata in search results
    showMetadata: true
    # Highlight query terms in results
    highlight: true
    # Color for highlighting search terms in snippets
    highlightColor: 'magenta'

    # TUI configuration
    # Override with DOC_INDEXER_THEME environment variable
    tui:
        # Available themes:
        # Dark: Default Dark, GitHub Dark, Ayu Dark, Dracula, Atom One, Shades Of Purple, Holiday, ANSI Dark
        # Light: Default Light, GitHub Light, Ayu Light, Xcode, Google Code, ANSI Light
        theme: 'GitHub Dark'

logging:
    level: 'info'
    verbose: false
    file: '~/.aria/logs/doc-indexer.log'
    maxFileSizeMb: 10
    maxFiles: 7

